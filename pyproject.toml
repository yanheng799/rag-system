[project]
name = "rag-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "python-multipart==0.0.20",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    "pymilvus==2.5.8",
    "minio==7.2.15",
    "pymupdf==1.25.5",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "redis==5.3.0",
    "python-dotenv==1.1.0",
    "Pillow==11.2.1",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
